<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b2f2a" />
    <meta
      name="description"
      content="A walking audio guide to the historical sites of Canterbury."
    />
    <title>Canterbury Walking Tour</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div id="map" class="map" role="application" aria-label="Map of the walking tour"></div>

      <aside
        id="detail"
        class="detail"
        aria-label="Site details"
        aria-hidden="true"
        tabindex="-1"
        inert
      >
        <button id="detailClose" type="button" class="detail__close" aria-label="Close">&times;</button>
        <button
          id="detailToggle"
          type="button"
          class="detail__toggle"
          aria-label="Collapse"
          aria-expanded="true"
        >
          <span class="detail__toggle-chip" aria-hidden="true">
            <svg class="detail__toggle-icon" viewBox="0 0 24 24" fill="none" focusable="false">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </button>
        <div id="detailContent" class="detail__content"></div>
      </aside>
    </div>

    <div class="map-overlay">
      <h1 class="brand">Canterbury Walking Tour</h1>
      <p id="locStatus" class="loc-status" role="status">Finding your location…</p>
    </div>

    <div id="arrivePrompt" class="arrive" hidden role="alert">
      <span id="arriveText" class="arrive__text"></span>
      <span class="arrive__actions">
        <button id="arriveListen" type="button" class="arrive__listen">Listen</button>
        <button id="arriveDismiss" type="button" class="arrive__dismiss" aria-label="Dismiss">&times;</button>
      </span>
    </div>

    <button id="finishFloat" type="button" class="finish-float">Finish</button>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="sites.js"></script>
    <script src="app.js"></script>
  </body>
</html>
