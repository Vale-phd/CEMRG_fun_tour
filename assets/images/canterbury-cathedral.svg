<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Illustration of Canterbury Cathedral">
  <title>Canterbury Cathedral</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd6e8"/>
      <stop offset="1" stop-color="#f3ebd9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c89a"/>
      <stop offset="1" stop-color="#9fb07f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>
  <circle cx="945" cy="128" r="58" fill="#fff6e6" opacity="0.75"/>
  <rect y="525" width="1200" height="75" fill="url(#ground)"/>
  <ellipse cx="600" cy="528" rx="430" ry="16" fill="#000" opacity="0.06"/>

  <!-- Bell Harry: central crossing tower, drawn first so the west front overlaps its base -->
  <g stroke="#a8966f" stroke-width="2" stroke-linejoin="round">
    <rect x="545" y="150" width="110" height="210" fill="#efe6d2"/>
    <rect x="552" y="141" width="12" height="11" fill="#efe6d2"/>
    <rect x="573" y="141" width="12" height="11" fill="#efe6d2"/>
    <rect x="594" y="141" width="12" height="11" fill="#efe6d2"/>
    <rect x="615" y="141" width="12" height="11" fill="#efe6d2"/>
    <rect x="636" y="141" width="12" height="11" fill="#efe6d2"/>
    <polygon points="543,150 543,134 552,112 561,134 561,150" fill="#ddd0b6"/>
    <polygon points="639,150 639,134 648,112 657,134 657,150" fill="#ddd0b6"/>
  </g>
  <path d="M556,265 L556,210 Q556,185 571,185 Q586,185 586,210 L586,265 Z" fill="#41566e"/>
  <path d="M614,265 L614,210 Q614,185 629,185 Q644,185 644,210 L644,265 Z" fill="#41566e"/>

  <!-- West front: central screen wall and gable -->
  <g stroke="#a8966f" stroke-width="2" stroke-linejoin="round">
    <rect x="455" y="300" width="290" height="225" fill="#e6dcc6"/>
    <polygon points="455,300 600,250 745,300" fill="#e6dcc6"/>
  </g>

  <!-- West towers -->
  <g stroke="#a8966f" stroke-width="2" stroke-linejoin="round">
    <rect x="345" y="250" width="110" height="275" fill="#ddd0b6"/>
    <rect x="745" y="250" width="110" height="275" fill="#ddd0b6"/>
    <!-- crenellations -->
    <rect x="352" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="373" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="394" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="415" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="436" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="752" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="773" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="794" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="815" y="241" width="12" height="11" fill="#ddd0b6"/>
    <rect x="836" y="241" width="12" height="11" fill="#ddd0b6"/>
    <!-- corner pinnacles -->
    <polygon points="343,250 343,232 351,210 359,232 359,250" fill="#ddd0b6"/>
    <polygon points="441,250 441,232 449,210 457,232 457,250" fill="#ddd0b6"/>
    <polygon points="743,250 743,232 751,210 759,232 759,250" fill="#ddd0b6"/>
    <polygon points="841,250 841,232 849,210 857,232 857,250" fill="#ddd0b6"/>
  </g>

  <!-- Windows: Bell Harry already done; now towers, west front, rose, door -->
  <g fill="#41566e">
    <!-- left tower -->
    <path d="M362,400 L362,356 Q362,335 375,335 Q388,335 388,356 L388,400 Z"/>
    <path d="M412,400 L412,356 Q412,335 425,335 Q438,335 438,356 L438,400 Z"/>
    <path d="M388,314 L388,292 Q388,278 400,278 Q412,278 412,292 L412,314 Z"/>
    <!-- right tower -->
    <path d="M762,400 L762,356 Q762,335 775,335 Q788,335 788,356 L788,400 Z"/>
    <path d="M812,400 L812,356 Q812,335 825,335 Q838,335 838,356 L838,400 Z"/>
    <path d="M788,314 L788,292 Q788,278 800,278 Q812,278 812,292 L812,314 Z"/>
    <!-- great west window -->
    <path d="M545,440 L545,348 Q545,312 600,312 Q655,312 655,348 L655,440 Z"/>
  </g>

  <!-- west window tracery -->
  <g stroke="#cdbf9c" stroke-width="3">
    <line x1="582" y1="440" x2="582" y2="330"/>
    <line x1="618" y1="440" x2="618" y2="330"/>
    <line x1="545" y1="398" x2="655" y2="398"/>
  </g>

  <!-- rose window -->
  <circle cx="600" cy="286" r="21" fill="#41566e" stroke="#cdbf9c" stroke-width="3"/>
  <g stroke="#cdbf9c" stroke-width="2">
    <line x1="579" y1="286" x2="621" y2="286"/>
    <line x1="600" y1="265" x2="600" y2="307"/>
    <line x1="585" y1="271" x2="615" y2="301"/>
    <line x1="615" y1="271" x2="585" y2="301"/>
  </g>

  <!-- portal -->
  <path d="M566,525 L566,470 Q566,440 600,440 Q634,440 634,470 L634,525 Z" fill="#463a2c" stroke="#a8966f" stroke-width="2"/>
  <path d="M576,525 L576,472 Q576,450 600,450 Q624,450 624,472 L624,525 Z" fill="none" stroke="#6b5a45" stroke-width="2"/>

  <!-- shrubs along the precinct -->
  <g fill="#7f9460">
    <ellipse cx="250" cy="525" rx="60" ry="26"/>
    <ellipse cx="965" cy="525" rx="70" ry="28"/>
    <ellipse cx="1080" cy="528" rx="55" ry="22"/>
    <ellipse cx="135" cy="528" rx="50" ry="22"/>
  </g>
</svg>
